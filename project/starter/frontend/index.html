<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaMart support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --ink: #1b1f3b;      /* night navy: text, header */
    --paper: #f7f7fb;    /* cool page background */
    --star: #ffc845;     /* NovaMart star: the single accent */
    --line: #d9dceb;     /* borders */
    --muted: #5b6080;    /* secondary text */
    --verified: #1f8a70; /* verified identity */
    --danger: #b3261e;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 1rem/1.55 var(--body); }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Brand */
  .brand { display: flex; align-items: center; gap: .6rem; font: 800 1.35rem/1 var(--display); letter-spacing: -.01em; }
  .brand svg { width: 1.6rem; height: 1.6rem; }

  /* Sign-in view */
  .signin { min-height: 100%; display: grid; place-items: center; padding: 2rem 1rem; }
  .signin form { width: min(24rem, 100%); }
  .signin h1 { font: 800 clamp(2rem, 6vw, 2.75rem)/1.05 var(--display); margin: 2.5rem 0 .5rem; letter-spacing: -.02em; }
  .signin p.lead { color: var(--muted); margin: 0 0 2rem; }
  label { display: block; font-weight: 700; margin: 1.1rem 0 .35rem; }
  input[type=email], input[type=password] {
    width: 100%; padding: .75rem .85rem; border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
  }
  .primary {
    width: 100%; margin-top: 1.6rem; padding: .85rem; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--ink); color: #fff; font-weight: 700;
  }
  .primary:disabled { opacity: .6; cursor: progress; }
  .error { color: var(--danger); margin: 1rem 0 0; min-height: 1.5em; }

  /* App view */
  .app { display: grid; grid-template-columns: 19rem 1fr; height: 100%; }
  aside { background: var(--ink); color: #fff; padding: 1.75rem 1.5rem; display: flex; flex-direction: column; gap: 1.75rem; }
  aside .brand { color: #fff; }

  /* The one memorable element: the identity "parcel label" */
  .label {
    position: relative; background: #fff; color: var(--ink); border-radius: 6px; padding: 1.1rem 1.1rem 1rem;
    box-shadow: 0 0 0 1.5px var(--star) inset;
  }
  .label::before {           /* perforated tear edge */
    content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 12px;
    background: radial-gradient(circle at 6px 6px, var(--ink) 4px, transparent 4.5px) 0 0 / 14px 12px repeat-x;
  }
  .label .who { font-weight: 700; }
  .label .customer { font: 800 2rem/1 var(--display); letter-spacing: .02em; margin: .35rem 0 .6rem; }
  .label .verified { display: flex; align-items: center; gap: .4rem; color: var(--verified); font-size: .9rem; }
  .label .verified svg { width: 1rem; height: 1rem; flex: none; }

  aside h2 { font: 500 1rem/1.3 var(--display); color: #c9cce0; margin: 0 0 .6rem; }
  .suggestions { display: grid; gap: .5rem; }
  .suggestions button {
    text-align: left; background: transparent; color: #fff; border: 1px solid #3a3f66; border-radius: 8px;
    padding: .55rem .7rem; cursor: pointer; line-height: 1.35;
  }
  .suggestions button:hover { border-color: var(--star); }
  .signout { margin-top: auto; background: none; border: 0; color: #c9cce0; text-decoration: underline; cursor: pointer; text-align: left; padding: 0; }

  main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  .thread { overflow-y: auto; padding: 2rem clamp(1rem, 4vw, 3rem); display: flex; flex-direction: column; gap: 1.1rem; }
  .empty { margin: auto; max-width: 32rem; text-align: center; color: var(--muted); }
  .empty strong { display: block; font: 800 1.6rem/1.15 var(--display); color: var(--ink); margin-bottom: .5rem; }
  .msg { max-width: min(42rem, 92%); padding: .85rem 1.05rem; border-radius: 14px; white-space: normal; }
  .msg.you { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.agent p { margin: 0 0 .6rem; } .msg.agent p:last-child { margin-bottom: 0; }
  .msg.agent ul, .msg.agent ol { margin: .2rem 0 .6rem; padding-left: 1.25rem; }
  .msg .meta { display: block; margin-top: .5rem; font-size: .8rem; color: var(--muted); }
  .msg.pending { color: var(--muted); }
  .msg.failed { border-color: var(--danger); color: var(--danger); }

  form.composer { display: flex; gap: .6rem; padding: 1rem clamp(1rem, 4vw, 3rem) 1.4rem; border-top: 1px solid var(--line); background: var(--paper); }
  form.composer textarea {
    flex: 1; resize: none; min-height: 3rem; max-height: 9rem; padding: .75rem .85rem;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
  }
  form.composer button { padding: 0 1.3rem; border: 0; border-radius: 10px; background: var(--star); color: var(--ink); font-weight: 700; cursor: pointer; }
  form.composer button:disabled { opacity: .55; cursor: progress; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { gap: 1rem; padding: 1.1rem; }
    .suggestions, aside h2 { display: none; }
    .label .customer { font-size: 1.5rem; }
    .signout { margin-top: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .msg { animation: arrive .18s ease-out; }
    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path fill="#ffc845" d="M12 1.5l2.6 7.3 7.4.3-5.8 4.6 2.1 7.3L12 16.8 5.7 21l2.1-7.3L2 9.1l7.4-.3z"/></symbol>
  <symbol id="check" viewBox="0 0 16 16"><path fill="currentColor" d="M6.2 11.6L2.6 8l1.1-1.1 2.5 2.5 6.1-6.1L13.4 4.4z"/></symbol>
</svg>

<!-- Sign-in -->
<section class="signin" id="signin-view">
  <form id="signin-form" novalidate>
    <div class="brand"><svg><use href="#star"/></svg>NovaMart</div>
    <h1>Help with your orders</h1>
    <p class="lead">Sign in to check an order, start a return or ask about our policies.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="signin-button" type="submit">Sign in</button>
    <p class="error" id="signin-error" role="alert"></p>
  </form>
</section>

<!-- Chat -->
<div class="app hidden" id="app-view">
  <aside>
    <div class="brand"><svg><use href="#star"/></svg>NovaMart</div>
    <div class="label" aria-label="Signed-in customer">
      <div class="who" id="who"></div>
      <div class="customer" id="customer">—</div>
      <div class="verified"><svg><use href="#check"/></svg>Linked to your sign-in, not editable</div>
    </div>
    <div>
      <h2>Try asking</h2>
      <div class="suggestions">
        <button type="button">What is the status of my order ORD-27176?</button>
        <button type="button">What is the return policy for premium customers?</button>
        <button type="button">How much would 5 items at $29.99 be with a 10% discount?</button>
      </div>
    </div>
    <button class="signout" id="signout" type="button">Sign out</button>
  </aside>
  <main>
    <div class="thread" id="thread" aria-live="polite">
      <div class="empty" id="empty"><strong>How can we help today?</strong>Answers come from NovaMart's support agents and usually take 20 to 40 seconds.</div>
    </div>
    <form class="composer" id="composer">
      <label for="message" class="hidden">Message</label>
      <textarea id="message" rows="1" placeholder="Ask about an order, a return or a policy" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
</div>

<script>
(() => {
  const cfg = window.NOVAMART_CONFIG;
  const $ = (id) => document.getElementById(id);
  const state = { token: null, sessionId: crypto.randomUUID().replace(/-/g, '') };

  // --- Cognito sign-in (USER_PASSWORD_AUTH, called directly on the Cognito API) ---
  async function signIn(email, password) {
    const res = await fetch(`https://cognito-idp.${cfg.region}.amazonaws.com/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-amz-json-1.1',
                 'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth' },
      body: JSON.stringify({ AuthFlow: 'USER_PASSWORD_AUTH', ClientId: cfg.clientId,
                             AuthParameters: { USERNAME: email, PASSWORD: password } }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Sign-in failed');
    return data.AuthenticationResult.AccessToken;
  }

  // --- Read the signed-in user's profile (display only: the proxy re-checks the token) ---
  async function getUser(token) {
    const res = await fetch(`https://cognito-idp.${cfg.region}.amazonaws.com/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-amz-json-1.1',
                 'X-Amz-Target': 'AWSCognitoIdentityProviderService.GetUser' },
      body: JSON.stringify({ AccessToken: token }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Could not read your profile');
    return Object.fromEntries(data.UserAttributes.map((a) => [a.Name, a.Value]));
  }

  // --- Minimal, safe rendering of the agents' Markdown (escape first, then format) ---
  function render(text) {
    const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const blocks = esc.split(/\n{2,}/).map((block) => {
      const lines = block.split('\n');
      if (lines.every((l) => /^\s*[-*] /.test(l))) return `<ul>${lines.map((l) => `<li>${l.replace(/^\s*[-*] /, '')}</li>`).join('')}</ul>`;
      if (lines.every((l) => /^\s*\d+\. /.test(l))) return `<ol>${lines.map((l) => `<li>${l.replace(/^\s*\d+\. /, '')}</li>`).join('')}</ol>`;
      return `<p>${lines.join('<br>')}</p>`;
    });
    return blocks.join('').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/^#+\s*/gm, '');
  }

  function bubble(kind, html) {
    $('empty')?.remove();
    const el = document.createElement('div');
    el.className = `msg ${kind}`;
    el.innerHTML = html;
    $('thread').append(el);
    el.scrollIntoView({ block: 'end' });
    return el;
  }

  async function send(text) {
    bubble('you', render(text));
    const pending = bubble('agent pending', 'Our agents are on it…');
    $('send').disabled = true;
    try {
      const res = await fetch(cfg.apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
        body: JSON.stringify({ message: text, session_id: state.sessionId }),
      });
      const data = await res.json();
      if (res.status === 401) { signOut('Your session expired. Sign in again.'); return; }
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      $('customer').textContent = data.customer_id;
      $('who').textContent = data.name ? `Signed in as ${data.name}` : 'Signed in';
      pending.className = 'msg agent';
      pending.innerHTML = render(data.reply || 'No answer was returned.') +
        (data.trace_id ? `<span class="meta">Trace ${data.trace_id}</span>` : '');
    } catch (err) {
      pending.className = 'msg agent failed';
      pending.textContent = `${err.message} Your message was not answered; send it again.`;
    } finally {
      $('send').disabled = false;
    }
  }

  function signOut(message) {
    state.token = null;
    $('app-view').classList.add('hidden');
    $('signin-view').classList.remove('hidden');
    $('signin-error').textContent = message || '';
  }

  $('signin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('signin-error').textContent = '';
    $('signin-button').disabled = true;
    try {
      state.token = await signIn($('email').value.trim(), $('password').value);
      const profile = await getUser(state.token);
      $('who').textContent = `Signed in as ${profile.name || profile.email}`;
      $('customer').textContent = profile['custom:customer_id'] || 'No account linked';
      $('signin-view').classList.add('hidden');
      $('app-view').classList.remove('hidden');
      $('message').focus();
    } catch (err) {
      $('signin-error').textContent = `${err.message}. Check your email and password.`;
    } finally {
      $('signin-button').disabled = false;
    }
  });

  $('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('message').value.trim();
    if (!text || $('send').disabled) return;
    $('message').value = '';
    send(text);
  });
  $('message').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); }
  });
  document.querySelectorAll('.suggestions button').forEach((b) =>
    b.addEventListener('click', () => { if (!$('send').disabled) send(b.textContent); }));
  $('signout').addEventListener('click', () => signOut());

  if (!cfg) $('signin-error').textContent = 'config.js is missing: run scripts/deploy_frontend_proxy.py.';
})();
</script>
</body>
</html>
